name: review-gate

# The lander's triple gate requires the PR body's `Review:` line to read
# `clean` before merge. This check makes that gate mechanical: PR #128 was
# merged by hand over `Review: findings held`, which the skill text alone
# could not prevent — and by 2026-08-05, 10 of 14 post-fix PRs carried that
# same contentless token. A held finding must be written out and resolved,
# not tokenized past the gate.
#
# Installed 2026-08-05 (workflow token scope granted); `review-line` is a
# required status check on main via branch protection.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

jobs:
  review-line:
    runs-on: ubuntu-latest
    steps:
      - name: Require "Review: clean" in the PR body
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          line=$(printf '%s' "$BODY" | tr -d '\r' | grep -E '^Review:' | tail -1 || true)
          case "$line" in
            "Review: clean"|"Review: clean "*)
              echo "gate: $line" ;;
            "")
              echo "::error::PR body has no 'Review:' line — run /code-review (two-axis), then append 'Review: clean' or 'Review:' plus the findings themselves."
              exit 1 ;;
            "Review: findings held"|"Review: findings held.")
              echo "::error::'findings held' is a contentless token — write the findings into the body, resolve them, then set 'Review: clean'."
              exit 1 ;;
            *)
              echo "::error::Review line reads '$line', not 'Review: clean' — resolve what it names before merging."
              exit 1 ;;
          esac
