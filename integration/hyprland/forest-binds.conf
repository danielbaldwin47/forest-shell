# forest-shell — Hyprland keybinds (#57)
#
# Source this from ~/.config/hypr/hyprland.conf:
#
#     source = ~/repos/forest-shell/integration/hyprland/forest-binds.conf
#
# This file is *not* the one shell-switch manages. shell-switch regenerates
# ~/.config/hypr/shell-switcher-binds.conf wholesale on every switch, and it
# owns exactly one bind — SUPER+Space, the launcher. Anything written there is
# lost at the next switch, which is why the rest of the shell's binds live here
# instead, under version control.
#
# ## The fallback idiom
#
# Every bind below is
#
#     qs -c forest ipc call <target> <fn> || <fallback>
#
# `qs ... ipc call` exits 255 when no instance is running (measured: "No running
# instances for …", and "Could not find \"forest\" config directory" when the
# config is not installed at all), so `||` fires exactly when the shell is down.
# The point is the acceptance criterion: with the shell dead, the keys still do
# something and the compositor stays usable, rather than every shell key
# becoming silently inert while the user is trying to fix it.
#
# SUPER+Space is the one exception and it is *not* in this file. shell-switch
# interpolates `launcher_cmd` with `sed -e "s|{{LAUNCHER_CMD}}|…|g"`, so a `|`
# anywhere in that value breaks the sed expression — the launcher bind cannot
# have a fallback at all. tools/register-shell-switch.sh enforces that, and
# tools/binds-harness.sh checks it.
#
# ## What the fallbacks are, and are not
#
# Only three of these degrade to something that does the job: lock falls through
# to logind, screenshot to grim. The rest fall through to a notification, on
# purpose — the alternative for the session menu would be a bare
# `hyprctl dispatch exit`, and a power menu whose degraded form is "log out
# immediately, no prompt" is worse than one that says it is unavailable. Logout
# already has its own bind (SUPER+M in keybinds.conf) that does not go through
# the shell.
#
# ## Chords
#
# All of these are SUPER+SHIFT+<key>, chosen against ~/.config/hypr/keybinds.conf
# as of #57 — that file uses SUPER+SHIFT only for workspace moves (1-9, 0) and
# SUPER+SHIFT+S for hyprshot. Nothing here collides. Two notes:
#
#   - screenshot is on P, not the conventional S, because S is hyprshot's.
#   - keybinds.conf still binds CTRL+ALT+Q to hyprlock and SUPER+N to
#     swaync-client, neither of which is installed. Those are dead keys, not
#     collisions; retiring them is the user's call, not this file's.

# Lock. Falls through to logind, which locks the session for real — the handler
# that actually blanks is whatever the session has, but the session is locked.
bind = SUPER SHIFT, L, exec, qs -c forest ipc call lock lock || loginctl lock-session

# Session / power menu. No safe degraded form — see above.
bind = SUPER SHIFT, Q, exec, qs -c forest ipc call session toggle || notify-send "forest-shell" "session menu unavailable — the shell is not running"

# Notification centre.
bind = SUPER SHIFT, N, exec, qs -c forest ipc call notificationcenter toggle || notify-send "forest-shell" "notification centre unavailable — the shell is not running"

# Settings window.
bind = SUPER SHIFT, comma, exec, qs -c forest ipc call settings toggle || notify-send "forest-shell" "settings unavailable — the shell is not running"

# Screenshot. The shell's picker is a region selector; the fallback is a plain
# full-screen grab, because slurp is not installed and grim alone cannot select.
bind = SUPER SHIFT, P, exec, qs -c forest ipc call screenshot open || sh -c 'mkdir -p ~/Pictures/screenshots && grim ~/Pictures/screenshots/$(date +%Y%m%d-%H%M%S).png'

# Screen recorder.
bind = SUPER SHIFT, R, exec, qs -c forest ipc call recorder toggle || notify-send "forest-shell" "recorder unavailable — the shell is not running"

# Keep-awake / idle inhibit.
bind = SUPER SHIFT, K, exec, qs -c forest ipc call keepawake toggle || notify-send "forest-shell" "keep-awake unavailable — the shell is not running"
