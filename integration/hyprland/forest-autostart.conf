# forest-shell — session autostart (#140)
#
# Source this from ~/.config/hypr/hyprland.conf, next to the binds:
#
#     source = ~/repos/forest-shell/integration/hyprland/forest-autostart.conf
#
# What it is for: the launcher's `;` provider reads a clipboard *history*, and
# Wayland has none. The data-device protocol hands out the current offer and
# nothing before it, so the store is `cliphist` and the thing that fills it is
# `wl-paste --watch`. With no watcher running, `cliphist list` says
# `opening db: please store something first` and the provider is empty forever —
# a failure that looks exactly like "I have not copied anything yet". That is
# how #140 was found: the lines below were documented in Services/README.md and
# held as data in ClipboardPolicy.autostart, and shipped in no file anyone
# installs, so following integration/README.md end to end produced a permanently
# empty `;`.
#
# Why this is a separate file from forest-binds.conf: that one is binds, and
# tools/binds-harness.sh treats every line in it as a bind to check against the
# shell's IPC surface. Autostart is a different kind of statement with a
# different check, so it gets its own file rather than a section.
#
# Needs `cliphist` and `wl-clipboard` installed. Both are packaged on Arch:
#
#     pacman -S cliphist wl-clipboard
#
# Two lines and not one. `wl-paste --watch` serves a single MIME family per
# invocation, so a single untyped watcher stores text and silently drops every
# image — a clipboard history that works until the first screenshot, then
# quietly does not. Both acceptance criteria in #53 name images.
#
# These lines are also `ClipboardPolicy.autostart`, which is what the launcher
# prints when the history is empty and the watcher is not running. The two
# cannot drift: tests/tst_clipboardpolicy.qml reads this file and fails if a
# line here stops matching the data.
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
